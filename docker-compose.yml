version: '3.8'

services:
  # InfluxDB - Time Series Database
  influxdb:
    image: influxdb:latest
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET_PRODUCTION}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    networks:
      - iot-network

  # Grafana - Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - influxdb
    networks:
      - iot-network

  # Mosquitto - MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot-network

  mqtt-influx-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: mqtt-influx-bridge
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=6K_N7xmi7XlSpBY9spLa8KYl5RrY25H5a7SLGgs16005oBaslAUHPCoEXjqA6Gv9rAn2bxaB56PIo6wYkZRs2Q==
      - INFLUXDB_ORG=nvme_influxdb_org0001
      - INFLUXDB_BUCKET_PRODUCTION=sensors
      - INFLUXDB_BUCKET_TRAINING=training_data
    volumes:
      - ./logs:/app/logs
    networks:
      - iot-network

  custom-lstm-detector:
    build:
      context: .
      dockerfile: Dockerfile.lstm
    container_name: custom-lstm-detector
    restart: unless-stopped
    depends_on:
      - mqtt-influx-bridge
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=6K_N7xmi7XlSpBY9spLa8KYl5RrY25H5a7SLGgs16005oBaslAUHPCoEXjqA6Gv9rAn2bxaB56PIo6wYkZRs2Q==
      - INFLUXDB_ORG=nvme_influxdb_org0001
      - INFLUXDB_BUCKET_PRODUCTION=sensors
      - INFLUXDB_BUCKET_TRAINING=training_data
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge
